appId: com.yarouki.badge-maximizer
productName: Badge Maximizer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!resources-backend/**'
  - '!resources-ffmpeg/**'
  - '!e2e/**'
  - '!coverage/**'
  - '!test-results/**'
  - '!playwright-report/**'
  - '!{playwright.config.mjs,vitest.config.mts,.editorconfig}'
extraResources:
  - from: 'build/icon.ico'
    to: 'icon.ico'
  - from: '../scripts'
    to: 'scripts'
    filter:
      - 'assets/video.mp4'
      - 'LICENSE'
  - from: 'resources-backend'
    to: 'backend'
    filter:
      - 'badge-backend.exe'
  - from: 'resources-ffmpeg'
    to: 'ffmpeg'
    filter:
      - 'ffmpeg.exe'
      - 'LICENSE'
      - 'README.txt'
      - 'FFMPEG-NOTICE.txt'
asarUnpack:
  - resources/**
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: badge-maximizer
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: Badge Maximizer
  uninstallDisplayName: Badge Maximizer
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.icns
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: yarouki
  category: Utility
  icon: build/icon.png
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
